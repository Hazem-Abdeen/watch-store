<section id="newsletter" class="abdeen-section" aria-labelledby="newsletter-heading">
    <div class="abdeen-shell">
        <div class="abdeen-newsletter-panel">
            <div class="tw:mx-auto tw:max-w-2xl tw:text-center">
                <p class="abdeen-newsletter-badge">{% include "oscar/partials/home/icon.html" with name="mail" %}The Abdeen Newsletter</p>
                <h2 id="newsletter-heading">Stay Informed on<br>New Releases &amp; Special Offers</h2>
                <p class="abdeen-newsletter-description" id="newsletter-status">Newsletter signup is coming soon. Email addresses are not being collected yet.</p>
                <fieldset disabled class="abdeen-newsletter-fields" aria-describedby="newsletter-status">
                    <legend class="tw:sr-only">Newsletter signup — coming soon</legend>
                    <label for="newsletter-email" class="tw:sr-only">Email address</label>
                    <input id="newsletter-email" type="email" placeholder="Enter your email address…" autocomplete="email">
                    <button type="button" class="abdeen-button abdeen-button-black">Coming Soon {% include "oscar/partials/home/icon.html" with name="arrow" %}</button>
                </fieldset>
            </div>
        </div>
    </div>
</section>
